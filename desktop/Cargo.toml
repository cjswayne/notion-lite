[package]
name = "notion-lite-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notion-lite = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
keyring = "4"
getrandom = "0.3"
tokio = { version = "1", features = ["net"] }
